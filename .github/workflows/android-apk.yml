name: Kelime Evreni Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android proje iskeletini olustur
        run: flutter create --platforms=android --project-name kelime_evreni --org com.teknolojix .
      - name: Varsayilan ornek testini temizle
        run: rm -f test/widget_test.dart
      - name: Bagimliliklar
        run: flutter pub get
      - name: Statik analiz
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: APK olustur
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Kelime-Evreni-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
